<!DOCTYPE html>
<html lang="ru">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Document</title>
		<link rel="stylesheet" href="./normalize.css" />
		<link rel="stylesheet" href="./style.css" />
	</head>
	<body>
		<form class="form">
			<fieldset class="form-group">
				<legend class="form-group-title">Ваши личные данные</legend>
				<label for="name" class="label"> Ваше имя </label>
				<input
					id="name"
					class="input-field"
					name="name"
					placeholder="Имя"
					type="text"
					required
				/>
				<label for="age" class="label"> Ваш возраст </label>
				<input
					id="age"
					class="input-field"
					name="age"
					placeholder="Возраст"
					type="number"
					required
				/>
				<label for="phone" class="label"> Ваш номер телефона </label>
				<input
					id="phone"
					class="input-field"
					name="phone"
					placeholder="Номер телефона"
					type="tel"
					required
					autocomplete="on"
				/>
				<label for="email" class="label"> Ваша почта </label>
				<input
					id="email"
					class="input-field"
					name="email"
					placeholder="Почта"
					type="email"
					required
					autocomplete="on"
				/>
			</fieldset>
			<fieldset class="form-group">
				<label for="message" class="label"> Сообщение </label>
				<textarea
					id="message"
					class="message"
					name="message"
					placeholder="Ваше Сообщение"
				></textarea>
				<label class="label checkbox-label">
					<input
						class="checkbox"
						type="checkbox"
						name="checkbox"
						required
					/>
					<span class="checkbox-text">Я принимаю правила</span>
				</label>
			</fieldset>
			<button class="button">Отправить</button>
		</form>
	</body>
</html>
